; NEXUS OS - M5StickC PLUS2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM)
[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32@6.9.0
framework = arduino
; Плата PLUS2 в PlatformIO отдельно не описана: берём m5stick-c (тот же ESP32),
; а размер флеша и разметку задаём явно. Определяет PLUS2 библиотека M5Unified.
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DNEXUS_VERSION=\"0.1.0\"

lib_deps =
    m5stack/M5Unified@^0.2.5
    m5stack/M5GFX@^0.2.5

; После сборки создаёт esp32fw.bin (полный образ для M5Burner, адрес 0x0)
extra_scripts = post:tools/merge_bin.py
